name: Deploy site

# Every push to main publishes site/ to Cloudflare. Before this workflow existed,
# deploys were manual (`npx wrangler deploy`), so pushing to GitHub changed
# nothing on massage-4-you.com — the live site sat five commits behind for two days.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token with the "Edit Cloudflare Workers" permissions
#   CLOUDFLARE_ACCOUNT_ID  — from any Cloudflare dashboard URL, or `wrangler whoami`

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; queue them instead of cancelling, so the newest
# commit is always what ends up live.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://massage-4-you.com
    steps:
      - name: Check out the commit being deployed
        uses: actions/checkout@v7

      - name: Upload site/ to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned so a wrangler release can never change a deploy's behaviour
          # without a commit here. Bump deliberately.
          wranglerVersion: "4.123.0"
          # There is no package.json or lockfile in this repo, so tell the action
          # which package manager to install wrangler with instead of inferring.
          packageManager: npm

      # The whole point of this workflow is that a green tick means the change is
      # actually live. Fetch the real pages over the real domain and prove it.
      - name: Verify the live pages
        run: |
          fail=0
          for path in / /cennik /zabiegi/ /zabiegi/masaz-klasyczny-poznan; do
            code=000
            for attempt in 1 2 3; do
              # No -f here: we want the status code itself, not a curl failure.
              # The || only catches genuine connection errors.
              code=$(curl -sS -o /dev/null -w '%{http_code}' "https://massage-4-you.com$path") || code=000
              [ "$code" = "200" ] && break
              sleep 5
            done
            if [ "$code" = "200" ]; then
              echo "ok   200  $path"
            else
              echo "::error::https://massage-4-you.com$path returned $code"
              fail=1
            fi
          done
          exit $fail

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Deploy of \`${GITHUB_SHA:0:7}\`"
            echo
            echo "- Worker URL: ${{ steps.deploy.outputs.deployment-url || 'n/a' }}"
            echo "- Live site: <https://massage-4-you.com>"
          } >> "$GITHUB_STEP_SUMMARY"

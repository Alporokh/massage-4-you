name: Verify live site

# This workflow does NOT deploy. Cloudflare's own Git integration builds
# massage-4-you.com on every push to main, and it works. An Actions workflow
# that deployed as well would only race it.
#
# What this does instead is answer the question that actually caused trouble
# here: "I pushed — is it really live?" It waits for Cloudflare to finish, then
# checks the real domain over HTTP. A green tick means the pages answer; a red
# one means the deploy did not land, rather than meaning a missing secret.
#
# No secrets required.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-live
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit that was pushed
        uses: actions/checkout@v7

      - name: Collect the URLs this commit expects to be live
        id: urls
        run: |
          grep -o '<loc>[^<]*</loc>' site/sitemap.xml \
            | sed 's|</\?loc>||g' > urls.txt
          echo "count=$(wc -l < urls.txt)" >> "$GITHUB_OUTPUT"
          echo "This commit expects $(wc -l < urls.txt) live URLs:"
          sed 's/^/  /' urls.txt

      # Cloudflare needs about a minute. Poll rather than sleep a fixed time,
      # and poll the LAST url in the sitemap — newly added pages go at the end,
      # so it is the one most likely to still be missing.
      - name: Wait for Cloudflare to finish deploying
        run: |
          last=$(tail -n1 urls.txt)
          echo "Waiting for: $last"
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$last" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Live after ~$(( i * 10 ))s"
              exit 0
            fi
            echo "  attempt $i: $code"
            sleep 10
          done
          echo "::error::$last never came up (waited 5 minutes). The Cloudflare deploy probably failed — check the Workers dashboard."
          exit 1

      - name: Every page in the sitemap must answer 200
        run: |
          fail=0
          while read -r url; do
            [ -z "$url" ] && continue
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$url") || code=000
            if [ "$code" = "200" ]; then
              printf '  ok   %s\n' "$url"
            else
              printf '::error::%s returned %s\n' "$url" "$code"
              fail=1
            fi
          done < urls.txt
          exit $fail

      # Catches the specific failure that started all this: the site serving an
      # older commit. If a page was added and the live sitemap has not caught
      # up, the deploy is stale even though every old URL still answers 200.
      - name: The live sitemap must match this commit
        run: |
          curl -sS https://massage-4-you.com/sitemap.xml | tr -d '\r' > live-sitemap.xml
          tr -d '\r' < site/sitemap.xml > repo-sitemap.xml
          if diff -q live-sitemap.xml repo-sitemap.xml > /dev/null; then
            echo "Live sitemap matches the repo."
          else
            echo "::error::The live sitemap differs from this commit — the deploy is stale or partial."
            diff repo-sitemap.xml live-sitemap.xml || true
            exit 1
          fi

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Live check for \`${GITHUB_SHA:0:7}\`"
            echo
            echo "- Site: <https://massage-4-you.com>"
            echo "- URLs checked: ${{ steps.urls.outputs.count }}"
            echo
            echo "Deploys are handled by Cloudflare's Git integration, not by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

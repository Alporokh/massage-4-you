# Cloudflare configuration — Worker with static assets.
#
# `name` must match the Worker name in the dashboard.
#
# There is no build step. The site is plain HTML/CSS/JS and `[assets]` uploads
# site/ as-is; the only Worker code is src/worker.js, which exists so the
# booking form has somewhere to POST. Every path except /api/booking is handed
# straight back to the asset layer, so static serving is unchanged.
# `npx wrangler deploy` is the deploy command; leave "Build command" empty.
#
# html_handling defaults to "auto-trailing-slash", which serves
# /zabiegi/masaz-klasyczny-poznan from masaz-klasyczny-poznan.html and
# redirects the .html URL there — matching the canonical tags and sitemap.

name = "massage-4-you"
main = "src/worker.js"
compatibility_date = "2026-08-15"

[assets]
directory = "./site"
# The Worker reaches the static files through this binding. Without it the
# Worker would have no way to serve the site once main is set.
binding = "ASSETS"
# Serve site/404.html for any path that does not match a file, with a real 404
# status. Without this Cloudflare returns a bare, unstyled "Not Found".
not_found_handling = "404-page"
